# What the deployed service needs, written down where the repo can be read
# instead of only in somebody's dashboard. The live service was created by hand,
# so this file is a description first and a blueprint second: adopting it in
# Render ("Blueprints" -> New Blueprint Instance, or Settings -> Adopt) is
# optional. If you do adopt it, add a `region:` matching the service you already
# have before you apply: a region cannot be changed after a service is created,
# so a mismatch builds a second service instead of taking over the first.
#
# Nothing secret belongs here. `sync: false` means "this one is set in the
# dashboard", and Render will not overwrite it.
#
# Full walkthrough, including the parts no file can do for you (OAuth redirect
# URIs, the first deploy): docs/deploy.md

services:
  - type: web
    name: ft-transcendence
    runtime: docker

    # One origin: this image carries the built frontend as well as Django, so
    # the page and the WebSockets share a host. See
    # docs/adr/0004-one-origin-in-production.md.
    dockerfilePath: ./docker/render/Dockerfile
    dockerContext: .

    # Nothing here needs a disk: uploads are rows in the database
    # (docs/adr/0005-uploaded-files-live-in-the-database.md), so the free
    # instance type is enough to run correctly. What it costs is sleep — a free
    # instance stops after 15 minutes idle, which drops every open WebSocket and
    # makes the next visitor wait out a cold start.
    plan: starter

    healthCheckPath: /healthz/

    envVars:
      - key: DJANGO_DEBUG
        value: "False"

      # The public host, and the origin CSRF will accept form posts from.
      - key: DJANGO_ALLOWED_HOSTS
        value: ft-transcendence-zn3z.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://ft-transcendence-zn3z.onrender.com

      # Where password-reset and e-mail-confirmation links point, and where
      # OAuth hands the browser back to. Same origin as everything else now.
      - key: FRONTEND_URL
        value: https://ft-transcendence-zn3z.onrender.com

      # Each worker holds its own Redis connection and its own BRPOP loop, so
      # this multiplies the channel-layer command count as well as the memory.
      - key: UVICORN_WORKERS
        value: "2"

      # Set in the dashboard.
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: FORTYTWO_OAUTH_CLIENT_ID
        sync: false
      - key: FORTYTWO_OAUTH_CLIENT_SECRET
        sync: false
